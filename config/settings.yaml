llm:
  model: "claude-sonnet-4-20250514"
  max_tokens_per_request: 4096
  batch_size: 12
  max_concurrent_batches: 3
  temperature: 0.3

report:
  max_github_repos: 10
  max_news_items: 15
  max_papers: 10
  max_social_items: 10
  min_importance_score: 3.0

content_fetch:
  enabled: true
  top_n: 25               # only fetch bodies for the top-N items by relevance
  min_existing_chars: 600 # skip items that already have enough content
  max_chars: 4000         # truncate extracted body before LLM
  timeout: 15
  concurrency: 8

dedup_state:
  enabled: true
  ttl_days: 30            # forget items not seen for this many days
  demote_factor: 0.4      # multiply importance of flat reruns
  escalation_factor: 1.5  # engagement must grow this much to stay at full weight
  escalation_min_delta: 50

# Relevance bonus by source — official/curated sources outrank community chatter
source_credibility:
  newsletter: 4.0
  rss_blog: 3.0
  hf_paper: 3.0
  china: 3.0
  bluesky: 2.0
  arxiv: 1.0

publishing:
  reports_repo: ""  # Override via REPORTS_REPO env var
  branch: "main"
  commit_message_template: "Add daily report for {date}"

general:
  timezone: "UTC"
  log_level: "INFO"

notifications:
  webhook_url: ""  # Override via DEEPRADAR_WEBHOOK_URL env var
  on_success: true
  on_failure: true
